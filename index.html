<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Central MiMotoYa</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310302A'/%3E%3Crect x='7' y='11' width='18' height='10' rx='2' fill='%23F2C200'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ===========================================================================
   MiMotoYa — Central de operación (rediseño 27-oct-2026)

   Un solo archivo, sin compilar. La identidad sale del oficio:
   · El verde bosque de la marca es la banda de mando de arriba, no una barra
     lateral. Las pestañas son carpetas que se pegan al papel de abajo.
   · Cada conductor se reconoce por su placa amarilla de servicio público y
     su número de móvil, como en la calle. El amarillo es SOLO para placas.
   · Cifras en Barlow Semi Condensed (tabulares); todo lo demás en Poppins,
     la letra de la app. El "Ya" de la marca va en verde claro.
   · Los estados nunca van solo con color: siempre llevan marca y palabra.

   Modo oscuro: sigue al sistema; el botón de la banda lo fija en claro u
   oscuro (se recuerda en este navegador).

   ?demo en la dirección abre la central con datos de mentira, sin conectar a
   Supabase. Sirve para mostrarla o para revisar el diseño.
   =========================================================================== */
:root {
  --bosque: #10302A;
  --bosque-2: #18443C;
  --bosque-3: #23574D;
  --sobre-bosque: #E7EFEA;
  --sobre-bosque-2: #9FB8AF;

  --papel: #E9ECE5;
  --hoja: #F7F8F4;
  --hoja-2: #EFF2EB;
  --tinta: #131B18;
  --tinta-2: #46544F;
  --tinta-3: #6B7873;
  --linea: #C9D0C7;
  --linea-suave: #DCE1D8;

  --placa: #F2C200;
  --placa-tinta: #1A1A14;

  --bien: #0B7D50;
  --bien-fondo: #DDEFE5;
  --aviso: #A65A05;
  --aviso-fondo: #F7E7D0;
  --grave: #B42318;
  --grave-fondo: #F6DEDA;
  --enlace: #0F6A5A;

  --sombra: 0 1px 0 rgba(16,48,42,.06), 0 6px 18px -10px rgba(16,48,42,.35);
  --seleccion: #10302A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --bosque: #0A1F1B; --bosque-2: #12302A; --bosque-3: #1C4038;
    --sobre-bosque: #E3ECE7; --sobre-bosque-2: #8FA79E;
    --papel: #0E1513; --hoja: #141D1A; --hoja-2: #192420;
    --tinta: #E4EAE6; --tinta-2: #A9B6B0; --tinta-3: #84928C;
    --linea: #2B3833; --linea-suave: #223029;
    --bien: #4CC08C; --bien-fondo: #133326;
    --aviso: #E6A04A; --aviso-fondo: #33260F;
    --grave: #F0776B; --grave-fondo: #3A1A17;
    --enlace: #6FD0B6;
    --sombra: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.8);
    --seleccion: #23574D;
    color-scheme: dark;
  }
}
:root[data-tema="oscuro"] {
  --bosque: #0A1F1B; --bosque-2: #12302A; --bosque-3: #1C4038;
  --sobre-bosque: #E3ECE7; --sobre-bosque-2: #8FA79E;
  --papel: #0E1513; --hoja: #141D1A; --hoja-2: #192420;
  --tinta: #E4EAE6; --tinta-2: #A9B6B0; --tinta-3: #84928C;
  --linea: #2B3833; --linea-suave: #223029;
  --bien: #4CC08C; --bien-fondo: #133326;
  --aviso: #E6A04A; --aviso-fondo: #33260F;
  --grave: #F0776B; --grave-fondo: #3A1A17;
  --enlace: #6FD0B6;
  --sombra: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.8);
  --seleccion: #23574D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Poppins", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  background: var(--papel); color: var(--tinta);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--enlace); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--placa); outline-offset: 2px; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
       stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cifra-fuente { font-family: "Barlow Semi Condensed", "Poppins", sans-serif; font-variant-numeric: tabular-nums; }

/* --- Banda de mando ------------------------------------------------------ */
.banda { background: var(--bosque); color: var(--sobre-bosque); }
.banda-arriba {
  display: flex; align-items: center; gap: 20px;
  padding: 0 24px; height: 56px; max-width: 1480px; margin: 0 auto;
}
.marca { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.marca b { font-size: 18px; font-weight: 700; letter-spacing: -0.03em; color: #fff; }
.marca b span { color: #5FD3A3; }
.marca small { font-size: 12.5px; color: var(--sobre-bosque-2); font-weight: 500; }
.nav { display: flex; align-self: stretch; gap: 2px; margin-left: 12px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.pestana {
  align-self: flex-end; height: 44px; padding: 0 16px;
  display: flex; align-items: center; gap: 8px;
  border: 0; border-radius: 8px 8px 0 0; background: transparent;
  color: var(--sobre-bosque-2); font-weight: 600; white-space: nowrap;
}
.pestana:hover { color: #fff; background: rgba(255,255,255,.05); }
.pestana[aria-selected="true"] { background: var(--papel); color: var(--tinta); }
.conteo {
  font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 13px;
  min-width: 20px; padding: 0 6px; height: 19px; line-height: 19px; text-align: center;
  border-radius: 4px; background: var(--bosque-3); color: #fff;
}
.pestana[aria-selected="true"] .conteo { background: var(--tinta); color: var(--papel); }
.conteo.urgente { background: var(--grave); color: #fff; }
.herramientas { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.vivo { font-size: 12.5px; color: var(--sobre-bosque-2); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.vivo i { width: 7px; height: 7px; border-radius: 50%; background: #3FD08F; box-shadow: 0 0 0 3px rgba(63,208,143,.18); }
.boton-banda {
  height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--bosque-3);
  background: transparent; color: var(--sobre-bosque); display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600;
}
.boton-banda:hover { background: var(--bosque-2); }
.boton-banda.girando .ico { animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* Franja de cifras del día, dentro de la banda */
.franja {
  max-width: 1480px; margin: 0 auto; padding: 14px 24px 18px;
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
}
.dato { padding: 2px 18px 0; border-left: 1px solid var(--bosque-3); min-width: 0; }
.dato:first-child { border-left: 0; padding-left: 0; }
.dato .que { font-size: 12.5px; color: var(--sobre-bosque-2); font-weight: 500; }
.dato .cuanto { font-size: 34px; line-height: 1.05; font-weight: 700; color: #fff; margin-top: 2px; }
.dato .cuanto small { font-size: 17px; font-weight: 600; color: var(--sobre-bosque-2); margin-left: 4px; }
.dato .detalle { font-size: 12.5px; color: var(--sobre-bosque-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dato.ojo .que { color: #F5C26B; }
.dato.ojo .que::before { content: "● "; }
.dato.rojo .que { color: #FF8F84; }
.dato.rojo .que::before { content: "▲ "; }

/* --- Hoja de trabajo ----------------------------------------------------- */
main { max-width: 1480px; margin: 0 auto; padding: 22px 24px 40px; }
.cabeza { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.cabeza h1 { font-size: 26px; font-weight: 700; line-height: 1.1; }
.cabeza p { margin: 4px 0 0; color: var(--tinta-2); max-width: 78ch; }
.cabeza .crece { flex: 1; min-width: 240px; }

.segmentos { display: inline-flex; max-width: 100%; border: 1px solid var(--linea); border-radius: 7px; overflow-x: auto; scrollbar-width: none; background: var(--hoja); }
.segmentos::-webkit-scrollbar { display: none; }
.segmentos button {
  border: 0; border-left: 1px solid var(--linea); background: transparent;
  padding: 7px 12px; font-weight: 600; font-size: 13px; color: var(--tinta-2);
  display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; flex: none;
}
.segmentos button:first-child { border-left: 0; }
.segmentos button[aria-pressed="true"] { background: var(--seleccion); color: #fff; }
.segmentos .n { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; opacity: .75; }

.campo {
  height: 34px; padding: 0 10px; border: 1px solid var(--linea); border-radius: 6px;
  background: var(--hoja); min-width: 0;
}
.campo:focus { outline: 2px solid var(--bosque-3); outline-offset: -1px; }
.buscar { width: 220px; }

.marco { background: var(--hoja); border: 1px solid var(--linea); border-radius: 8px; box-shadow: var(--sombra); overflow: hidden; }
.tabla-env { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left; font-size: 12.5px; font-weight: 600; color: var(--tinta-3);
  padding: 9px 14px; border-bottom: 1px solid var(--linea); background: var(--hoja-2); white-space: nowrap;
}
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--linea-suave); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--hoja-2); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
.nombre { font-weight: 700; }
.sub { font-size: 12.5px; color: var(--tinta-3); }
.pie-tabla { padding: 9px 14px; font-size: 12.5px; color: var(--tinta-3); border-top: 1px solid var(--linea); background: var(--hoja-2); display: flex; gap: 12px; flex-wrap: wrap; }

/* Placa de servicio público + número de móvil */
.vehiculo { display: inline-flex; align-items: stretch; gap: 0; vertical-align: middle; }
.placa {
  font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .06em;
  background: var(--placa); color: var(--placa-tinta);
  border: 1.5px solid var(--placa-tinta); border-radius: 4px; padding: 0 7px; line-height: 22px; white-space: nowrap;
}
.movil {
  font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 13px;
  border: 1.5px solid var(--tinta); border-left: 0; border-radius: 0 4px 4px 0;
  padding: 0 6px; line-height: 22px; color: var(--tinta); background: var(--hoja);
  margin-left: -3px;
}
.sin-placa { font-size: 12.5px; color: var(--tinta-3); border: 1.5px dashed var(--linea); border-radius: 4px; padding: 1px 7px; }

.estado { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.estado::before { font-size: 10px; }
.estado.bien { color: var(--bien); background: var(--bien-fondo); }
.estado.bien::before { content: "●"; }
.estado.aviso { color: var(--aviso); background: var(--aviso-fondo); }
.estado.aviso::before { content: "●"; }
.estado.grave { color: var(--grave); background: var(--grave-fondo); }
.estado.grave::before { content: "✕"; }
.estado.neutro { color: var(--tinta-2); background: var(--hoja-2); border: 1px solid var(--linea); }
.estado.neutro::before { content: "○"; }
.estado.sos { color: #fff; background: var(--grave); }
.estado.sos::before { content: "▲"; }
.conectado { color: var(--bien); font-weight: 600; font-size: 12.5px; }
.conectado::before { content: "● "; }

.btn {
  height: 30px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--linea);
  background: var(--hoja); font-weight: 600; font-size: 13px; color: var(--tinta);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--tinta-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.fuerte { background: var(--seleccion); border-color: var(--seleccion); color: #fff; }
.btn.fuerte:hover { background: var(--bosque-2); }
.btn.peligro { color: var(--grave); border-color: color-mix(in srgb, var(--grave) 45%, transparent); background: transparent; }
.btn.doc { height: 26px; font-size: 12.5px; padding: 0 8px; }
.acciones { display: flex; gap: 6px; flex-wrap: wrap; }

/* Vacíos: dicen qué pasa y qué hacer */
.vacio { padding: 28px 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: start; }
.vacio .marca-vacio {
  grid-row: span 3; width: 44px; height: 44px; border-radius: 8px;
  border: 1.5px solid var(--linea); display: grid; place-items: center; color: var(--tinta-3);
}
.vacio .marca-vacio .ico { width: 20px; height: 20px; }
.vacio h3 { font-size: 16px; font-weight: 700; }
.vacio p { margin: 0; color: var(--tinta-2); max-width: 70ch; }
.vacio .acciones { margin-top: 8px; }
.cargando { padding: 26px 22px; color: var(--tinta-3); }
.error { padding: 22px; color: var(--grave); }

/* Caja */
.caja-arriba { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.total-caja { display: flex; gap: 0; margin-bottom: 14px; border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); box-shadow: var(--sombra); overflow: hidden; }
.total-caja > div { padding: 14px 18px; border-left: 1px solid var(--linea); flex: 1; min-width: 0; }
.total-caja > div:first-child { border-left: 0; flex: 1.6; background: var(--seleccion); color: #fff; }
.total-caja .que { font-size: 12.5px; color: var(--tinta-3); }
.total-caja > div:first-child .que { color: var(--sobre-bosque-2); }
.total-caja .cuanto { font-size: 30px; font-weight: 700; line-height: 1.1; }
.total-caja > div:first-child .cuanto { font-size: 40px; }
.caja-columnas { display: grid; grid-template-columns: 1fr 1.25fr; gap: 14px; align-items: start; }
.caja-columnas h2 { font-size: 15px; font-weight: 700; padding: 11px 14px; border-bottom: 1px solid var(--linea); display: flex; gap: 8px; align-items: baseline; }
.caja-columnas h2 .sub { font-weight: 500; }
.barra { height: 8px; background: var(--hoja-2); border-radius: 2px; min-width: 60px; position: relative; overflow: hidden; }
.barra i { position: absolute; inset: 0 auto 0 0; background: var(--bosque-3); border-radius: 2px; }
:root[data-tema="oscuro"] .barra i { background: var(--bien); }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .barra i { background: var(--bien); } }
tr.hoy td { font-weight: 700; }
tr.cero td { color: var(--tinta-3); }
tr.elegible { cursor: pointer; }
tr.elegido td { background: var(--hoja-2); box-shadow: inset 3px 0 0 var(--bosque-3); }

/* --- Entrada ------------------------------------------------------------- */
.entrada { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.entrada .lado { background: var(--bosque); color: var(--sobre-bosque); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
.entrada .lado h2 { font-size: 40px; font-weight: 700; color: #fff; line-height: 1.05; max-width: 14ch; letter-spacing: -0.03em; }
.entrada .lado p { color: var(--sobre-bosque-2); max-width: 44ch; }
.entrada .formulario { display: grid; place-items: center; padding: 32px; }
.entrada form { width: 100%; max-width: 360px; }
.entrada h1 { font-size: 24px; font-weight: 700; }
.entrada .intro { color: var(--tinta-2); margin: 6px 0 18px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--tinta-2); margin: 14px 0 5px; }
.entrada input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--linea); border-radius: 6px; background: var(--hoja); }
.entrada input:focus { outline: 2px solid var(--bosque-3); outline-offset: -1px; }
.entrada .btn { width: 100%; height: 42px; justify-content: center; margin-top: 16px; font-size: 14px; }
.pista { font-size: 12.5px; color: var(--tinta-3); margin-top: 6px; }
.mensaje-error { background: var(--grave-fondo); color: var(--grave); border-radius: 6px; padding: 9px 12px; margin-top: 14px; }
pre.sql { background: var(--hoja-2); border: 1px solid var(--linea); padding: 12px; border-radius: 6px; font-size: 12px; overflow: auto; }

/* --- Angosto ------------------------------------------------------------- */
@media (max-width: 1100px) {
  .franja { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
  .dato:nth-child(4) { border-left: 0; padding-left: 0; }
  .caja-columnas { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .banda-arriba { padding: 0 14px; gap: 10px; }
  .marca small, .vivo, .boton-banda .txt { display: none; }
  .banda-arriba { flex-wrap: wrap; height: auto; padding-top: 10px; }
  .nav { order: 3; width: 100%; margin-left: -4px; }
  .franja { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px 14px 16px; }
  .dato, .dato:nth-child(4) { border-left: 0; padding-left: 0; }
  .dato .cuanto { font-size: 28px; }
  main { padding: 16px 14px 32px; }
  .buscar { width: 100%; }
  .total-caja { flex-wrap: wrap; }
  .total-caja > div { flex: 1 1 45%; }
  .total-caja > div:first-child { flex-basis: 100%; }
  .entrada { grid-template-columns: 1fr; }
  .entrada .lado { padding: 28px 22px; }
  .entrada .lado h2 { font-size: 30px; }
  thead { display: none; }
  tbody tr { display: block; padding: 10px 14px; border-bottom: 1px solid var(--linea-suave); }
  tbody td { display: block; border: 0; padding: 3px 0; }
  td.num { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="raiz"></div>

<script type="module">
// ============================================================================
// Tema (claro/oscuro). Preferencia de este navegador; si no se puede guardar,
// la central funciona igual siguiendo al sistema.
// ============================================================================
const CLAVE_TEMA = 'mimotoya.central.tema';
const leerTema = () => { try { return localStorage.getItem(CLAVE_TEMA) || 'sistema'; } catch { return 'sistema'; } };
function aplicarTema(t) {
  if (t === 'sistema') document.documentElement.removeAttribute('data-tema');
  else document.documentElement.setAttribute('data-tema', t);
  try { localStorage.setItem(CLAVE_TEMA, t); } catch {}
}
aplicarTema(leerTema());
const temaEfectivo = () => {
  const t = leerTema();
  if (t !== 'sistema') return t;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
};

// ============================================================================
// Conexión — en ?demo, un cliente de mentira con datos de ejemplo.
// ============================================================================
const DEMO = new URLSearchParams(location.search).has('demo');
const CLAVE_CONFIG = 'mimotoya.consola.config';
const leerConfig = () => { try { return JSON.parse(localStorage.getItem(CLAVE_CONFIG) ?? 'null'); } catch { return null; } };
const guardarConfig = (c) => { try { localStorage.setItem(CLAVE_CONFIG, JSON.stringify(c)); } catch {} };
const borrarConfig = () => { try { localStorage.removeItem(CLAVE_CONFIG); } catch {} };

let sb = null;
const estado = { perfil: null, pestana: 'conductores' };
const raiz = document.getElementById('raiz');

const TRAZOS = {
  revisar: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/>',
  ruta: '<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
  escudo: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  caja: '<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/>',
  refrescar: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',

  bajar: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  motocarro: '<path d="M4 17h2m4 0h6"/><circle cx="7" cy="17" r="2"/><circle cx="18" cy="17" r="2"/><path d="M5 17V9a2 2 0 0 1 2-2h7l4 5v5"/><path d="M14 7v5h4"/>',
};
const ico = (n) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${TRAZOS[n] ?? ''}</svg>`;

const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = (n) => '$ ' + Math.round(Number(n) || 0).toLocaleString('es-CO');
const numero = (n) => (Number(n) || 0).toLocaleString('es-CO');
const plural = (n, uno, varios) => `${numero(n)} ${Number(n) === 1 ? uno : varios}`;

function haceCuanto(iso) {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  return `hace ${Math.floor(s / 86400)} d`;
}
const hora = (iso) => iso ? new Date(iso).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Bogota' }) : '—';
const telefonoLegible = (t) => {
  const d = String(t ?? '').replace(/\D/g, '').replace(/^57/, '');
  return d.length === 10 ? `${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}` : (t ?? '—');
};

// Fechas en hora de Colombia, como 'YYYY-MM-DD'.
const hoyCo = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
const sumarDias = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const nombreDia = (iso) => new Date(iso + 'T12:00:00Z').toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });

function vehiculoHTML(v) {
  if (!v || !v.placa) return '<span class="sin-placa">Sin placa</span>';
  const placa = String(v.placa).toUpperCase().replace(/^([A-Z]{3})(\d)/, '$1 $2');
  const movil = v.numero_movil ? `<span class="movil">M${String(v.numero_movil).padStart(2,'0')}</span>` : '';
  return `<span class="vehiculo"><span class="placa">${esc(placa)}</span>${movil}</span>`;
}

function textoError(e) {
  if (!e) return 'Algo salió mal.';
  if (e.details) return e.details;
  const m = String(e.message ?? e);
  if (m === 'NO_AUTORIZADO') return 'Tu cuenta no es de operador. Pide que te agreguen a la tabla operador.';
  if (m.includes('Failed to fetch')) return 'No hay conexión con Supabase. Revisa la URL del proyecto o tu internet.';
  if (m.toLowerCase().includes('invalid api key')) return 'La llave anon no es correcta.';
  if (m.includes('op_acumulado') && m.toLowerCase().includes('function')) return 'Falta aplicar la migración 0062 en la base de datos (npx supabase db push).';
  return m;
}

async function rpc(nombre, args = {}) {
  const { data, error } = await sb.rpc(nombre, args);
  if (error) throw error;
  return data;
}

function pintarEntrada(paso = 'telefono', datos = {}, error = '') {
  raiz.innerHTML = `<div class="entrada">${ladoMarca()}
    <div class="formulario"><form id="f">
      <h1>${paso === 'telefono' ? 'Entrar a la central' : 'Escribe el código'}</h1>
      <p class="intro">${paso === 'telefono'
        ? 'Con el mismo celular con el que entras a la app.'
        : `Llegó por mensaje al ${esc(telefonoLegible(datos.telefono))}.`}</p>
      ${paso === 'telefono'
        ? `<label for="tel">Celular</label>
           <input id="tel" type="tel" required inputmode="numeric" maxlength="10" placeholder="300 123 4567" value="${esc(datos.telefono ?? '')}" />`
        : `<label for="cod">Código de 6 números</label>
           <input id="cod" type="text" required inputmode="numeric" maxlength="6" autofocus />`}
      <button class="btn fuerte" type="submit">${paso === 'telefono' ? 'Enviarme el código' : 'Entrar'}</button>
      ${paso === 'codigo' ? '<button class="btn" type="button" id="atras">Usar otro número</button>' : ''}
      ${error ? `<div class="mensaje-error">${esc(error)}</div>` : ''}
      <p class="pista" style="margin-top:22px"><a href="#" id="cambiar-proyecto">Conectar con otro proyecto</a></p>
    </form></div></div>`;
  document.getElementById('cambiar-proyecto').onclick = (ev) => { ev.preventDefault(); borrarConfig(); pintarConfiguracion(); };
  const atras = document.getElementById('atras');
  if (atras) atras.onclick = () => pintarEntrada('telefono', datos);
  document.getElementById('f').onsubmit = async (ev) => {
    ev.preventDefault();
    const boton = ev.target.querySelector('button[type=submit]');
    boton.disabled = true;
    try {
      if (paso === 'telefono') {
        const tel = document.getElementById('tel').value.replace(/\D/g, '');
        if (tel.length !== 10) throw new Error('El número debe tener 10 dígitos.');
        const { error } = await sb.auth.signInWithOtp({ phone: '+57' + tel });
        if (error) throw error;
        pintarEntrada('codigo', { telefono: tel });
      } else {
        const cod = document.getElementById('cod').value.replace(/\D/g, '');
        const { error } = await sb.auth.verifyOtp({ phone: '+57' + datos.telefono, token: cod, type: 'sms' });
        if (error) throw error;
        await arrancarSesion();
      }
    } catch (e) {
      boton.disabled = false;
      pintarEntrada(paso, datos, textoError(e));
    }
  };
}

// ============================================================================
// Caja: acumulado diario de viajes y plata, separable por conductor
// ============================================================================
const caja = { rango: 'hoy', desde: hoyCo(), hasta: hoyCo(), conductor: '' };
let ultimaCaja = null;

function rangoDe(r) {
  const h = hoyCo();
  if (r === 'hoy') return [h, h];
  if (r === 'ayer') return [sumarDias(h, -1), sumarDias(h, -1)];
  if (r === '7') return [sumarDias(h, -6), h];
  if (r === 'mes') return [h.slice(0, 8) + '01', h];
  return [caja.desde, caja.hasta];
}

async function hojaCaja() {
  [caja.desde, caja.hasta] = rangoDe(caja.rango);
  const [datos, conductores] = await Promise.all([
    rpc('op_acumulado', { p_desde: caja.desde, p_hasta: caja.hasta, p_conductor: caja.conductor || null }),
    cacheConductores.length ? Promise.resolve(cacheConductores) : rpc('op_conductores', { p_estado: null }),
  ]);
  cacheConductores = conductores;
  ultimaCaja = datos;
  const r = datos.resumen ?? {};
  const elegido = conductores.find((c) => c.conductor_id === caja.conductor);
  const unDia = caja.desde === caja.hasta;
  const periodo = unDia
    ? (caja.desde === hoyCo() ? 'hoy' : nombreDia(caja.desde))
    : `del ${nombreDia(caja.desde)} al ${nombreDia(caja.hasta)}`;
  const promedio = r.viajes ? Math.round(r.recaudo / r.viajes) : 0;

  const rangos = [['hoy', 'Hoy'], ['ayer', 'Ayer'], ['7', 'Últimos 7 días'], ['mes', 'Este mes'], ['otro', 'Fechas…']];
  const cabeza = `<div class="cabeza"><div class="crece"><h1>Caja</h1>
      <p>Viajes terminados y plata que movieron, por día y por conductor. Cuenta con hora de Colombia: un viaje de las 11 p. m. es de ese día.</p></div>
    <button class="btn" id="exportar">${ico('bajar')} Descargar para Excel</button></div>
    <div class="caja-arriba">
      <div class="segmentos" role="group" aria-label="Periodo">
        ${rangos.map(([v, t]) => `<button data-rango="${v}" aria-pressed="${caja.rango === v}">${t}</button>`).join('')}
      </div>
      ${caja.rango === 'otro' ? `<input class="campo" type="date" id="desde" value="${caja.desde}" max="${hoyCo()}" aria-label="Desde" />
        <span class="sub">a</span><input class="campo" type="date" id="hasta" value="${caja.hasta}" max="${hoyCo()}" aria-label="Hasta" />` : ''}
      <select class="campo" id="conductor" aria-label="Conductor">
        <option value="">Todos los conductores</option>
        ${conductores.filter((c) => c.estado_verificacion === 'verificado' || c.conductor_id === caja.conductor)
          .sort((a, b) => (a.vehiculo?.numero_movil ?? 99) - (b.vehiculo?.numero_movil ?? 99))
          .map((c) => `<option value="${c.conductor_id}" ${c.conductor_id === caja.conductor ? 'selected' : ''}>${c.vehiculo?.numero_movil ? 'M' + String(c.vehiculo.numero_movil).padStart(2, '0') + ' · ' : ''}${esc(c.nombre ?? 'Sin nombre')}</option>`).join('')}
      </select>
      ${caja.conductor ? '<button class="btn" id="quitar-conductor">Ver todos</button>' : ''}
    </div>`;

  const total = `<div class="total-caja">
    <div><div class="que">${elegido ? `${esc(elegido.nombre)}, ${esc(periodo)}` : `Recaudo ${esc(periodo)}`}</div><div class="cuanto cifra-fuente">${pesos(r.recaudo)}</div></div>
    <div><div class="que">Viajes terminados</div><div class="cuanto cifra-fuente">${numero(r.viajes)}</div></div>
    <div><div class="que">Pasajeros llevados</div><div class="cuanto cifra-fuente">${numero(r.pasajeros)}</div></div>
    <div><div class="que">${elegido ? 'Promedio por viaje' : 'Conductores que trabajaron'}</div><div class="cuanto cifra-fuente">${elegido ? pesos(promedio) : numero(r.conductores)}</div></div>
  </div>`;

  if (!r.viajes) {
    const sugerencia = caja.rango === 'hoy'
      ? `Todavía no se ha terminado ningún viaje hoy. ${metricas.viajes_en_curso ? `Hay ${plural(metricas.viajes_en_curso, 'viaje', 'viajes')} en la calle ahora; aparecen aquí apenas el conductor lo cierre.` : 'Cada viaje aparece aquí apenas el conductor lo cierra en la app.'}`
      : `No hubo viajes terminados ${elegido ? `de ${esc(elegido.nombre)} ` : ''}${esc(periodo)}.`;
    return cabeza + total + `<div class="marco">${vacio('caja', 'Sin movimiento en este periodo', sugerencia,
      caja.rango !== '7' ? '<button class="btn fuerte" data-rango="7">Ver últimos 7 días</button>' : '')}</div>`;
  }

  const maxDia = Math.max(1, ...datos.por_dia.map((d) => d.recaudo));
  const porDia = `<div class="marco"><h2>Día por día <span class="sub">${plural(datos.por_dia.length, 'día', 'días')}</span></h2>
    <div class="tabla-env"><table>
      <thead><tr><th>Día</th><th class="num">Viajes</th><th class="num">Plata</th><th style="width:34%"></th></tr></thead>
      <tbody>${datos.por_dia.slice().reverse().map((d) => `<tr class="${d.dia === hoyCo() ? 'hoy' : ''} ${d.viajes ? '' : 'cero'}">
        <td>${esc(d.dia === hoyCo() ? 'Hoy' : nombreDia(d.dia))}</td>
        <td class="num">${numero(d.viajes)}</td>
        <td class="num cifra-fuente" style="font-size:15px;font-weight:700">${pesos(d.recaudo)}</td>
        <td><div class="barra" aria-hidden="true"><i style="width:${(d.recaudo / maxDia * 100).toFixed(1)}%"></i></div></td>
      </tr>`).join('')}</tbody></table></div></div>`;

  const maxCond = Math.max(1, ...datos.por_conductor.map((c) => c.recaudo));
  const porConductor = elegido
    ? `<div class="marco"><h2>Viajes de ${esc(elegido.nombre)} <span class="sub">${plural(datos.viajes.length, 'viaje', 'viajes')}</span></h2>
        <div class="tabla-env"><table>
          <thead><tr><th>Terminó</th><th>Destino</th><th class="num">Pasajeros</th><th class="num">Cobró</th></tr></thead>
          <tbody>${datos.viajes.map((v) => `<tr>
            <td>${esc(unDia ? hora(v.fin_at) : `${nombreDia(new Date(v.fin_at).toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }))}, ${hora(v.fin_at)}`)}</td>
            <td>${esc(v.destino ?? 'Punto en el mapa')}</td>
            <td class="num">${numero(v.ocupacion)}</td>
            <td class="num cifra-fuente" style="font-size:15px;font-weight:700">${pesos(v.monto)}</td>
          </tr>`).join('')}</tbody></table></div></div>`
    : `<div class="marco"><h2>Por conductor <span class="sub">toca una fila para ver sus viajes</span></h2>
        <div class="tabla-env"><table>
          <thead><tr><th>Vehículo</th><th>Conductor</th><th class="num">Viajes</th><th class="num">Plata</th><th style="width:22%"></th></tr></thead>
          <tbody>${datos.por_conductor.map((c) => `<tr class="elegible" data-elegir="${c.conductor_id}" tabindex="0">
            <td>${vehiculoHTML(c)}</td>
            <td><div class="nombre">${esc(c.nombre ?? 'Sin nombre')}</div><div class="sub">último ${esc(unDia ? hora(c.ultimo) : haceCuanto(c.ultimo))}</div></td>
            <td class="num">${numero(c.viajes)}</td>
            <td class="num cifra-fuente" style="font-size:15px;font-weight:700">${pesos(c.recaudo)}</td>
            <td><div class="barra" aria-hidden="true"><i style="width:${(c.recaudo / maxCond * 100).toFixed(1)}%"></i></div></td>
          </tr>`).join('')}</tbody></table></div>
          <div class="pie-tabla">${plural(datos.por_conductor.length, 'conductor trabajó', 'conductores trabajaron')} en este periodo.</div></div>`;

  return cabeza + total + `<div class="caja-columnas">${porDia}${porConductor}</div>`;
}

function exportarCaja() {
  if (!ultimaCaja) return;
  const filas = [['Desde', ultimaCaja.desde, 'Hasta', ultimaCaja.hasta], [],
    ['Día', 'Viajes', 'Plata'], ...ultimaCaja.por_dia.map((d) => [d.dia, d.viajes, d.recaudo]), [],
    ['Móvil', 'Placa', 'Conductor', 'Teléfono', 'Viajes', 'Plata'],
    ...ultimaCaja.por_conductor.map((c) => [c.numero_movil ?? '', c.placa ?? '', c.nombre ?? '', c.telefono ?? '', c.viajes, c.recaudo])];
  if (ultimaCaja.viajes?.length) filas.push([], ['Terminó', 'Destino', 'Pasajeros', 'Cobró'],
    ...ultimaCaja.viajes.map((v) => [new Date(v.fin_at).toLocaleString('es-CO', { timeZone: 'America/Bogota' }), v.destino ?? '', v.ocupacion, v.monto]));
  const csv = '﻿' + filas.map((f) => f.map((x) => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `caja-mimotoya-${ultimaCaja.desde}${ultimaCaja.desde !== ultimaCaja.hasta ? '-a-' + ultimaCaja.hasta : ''}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const HOJAS = { conductores: hojaConductores, viajes: hojaViajes, caja: hojaCaja, seguridad: hojaSeguridad, municipios: hojaMunicipios };

async function pintarHoja() {
  const hoja = document.getElementById('hoja');
  if (!hoja.querySelector('.cabeza')) hoja.innerHTML = '<div class="cargando">Cargando…</div>';
  try {
    hoja.innerHTML = await HOJAS[estado.pestana]();
    conectarHoja();
  } catch (e) {
    hoja.innerHTML = `<div class="marco"><div class="error">${esc(textoError(e))}</div></div>`;
  }
}

function irA(pestana) {
  estado.pestana = pestana;
  document.querySelectorAll('.pestana[data-p]').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.p === pestana)));
  pintarHoja();
}

function conectarHoja() {
  document.querySelectorAll('[data-filtro]').forEach((b) => b.onclick = () => { filtroConductores = b.dataset.filtro; pintarHoja(); });
  const buscar = document.getElementById('buscar');
  if (buscar) buscar.oninput = () => {
    busqueda = buscar.value;
    clearTimeout(buscar._t);
    buscar._t = setTimeout(async () => { await pintarHoja(); const b = document.getElementById('buscar'); b?.focus(); b?.setSelectionRange(b.value.length, b.value.length); }, 220);
  };
  const limpiar = document.getElementById('limpiar');
  if (limpiar) limpiar.onclick = () => { busqueda = ''; pintarHoja(); };

  document.querySelectorAll('[data-doc]').forEach((b) => b.onclick = async () => {
    if (DEMO) return alert('En el modo de ejemplo no hay documentos.');
    b.disabled = true;
    const { data, error } = await sb.storage.from('documentos-conductor').createSignedUrl(b.dataset.doc, 3600);
    b.disabled = false;
    if (error || !data) return alert('No se pudo abrir el documento: ' + textoError(error));
    window.open(data.signedUrl, '_blank', 'noopener');
  });

  const decidir = async (boton, id, nuevo) => {
    boton.disabled = true;
    try { await rpc('op_verificar_conductor', { p_conductor_id: id, p_estado: nuevo }); await refrescarTodo(); }
    catch (e) { alert(textoError(e)); boton.disabled = false; }
  };
  document.querySelectorAll('[data-aprobar]').forEach((b) => b.onclick = () => decidir(b, b.dataset.aprobar, 'verificado'));
  document.querySelectorAll('[data-rechazar]').forEach((b) => b.onclick = () => {
    if (confirm('¿Rechazar a este conductor? Deja de recibir viajes de inmediato.')) decidir(b, b.dataset.rechazar, 'rechazado');
  });
  document.querySelectorAll('[data-ver-caja]').forEach((b) => b.onclick = () => { caja.conductor = b.dataset.verCaja; caja.rango = 'hoy'; irA('caja'); });

  document.querySelectorAll('[data-rango]').forEach((b) => b.onclick = () => {
    caja.rango = b.dataset.rango;
    if (caja.rango === 'otro') { caja.desde = sumarDias(hoyCo(), -6); caja.hasta = hoyCo(); }
    pintarHoja();
  });
  const desde = document.getElementById('desde'), hasta = document.getElementById('hasta');
  if (desde && hasta) {
    const cambiar = () => {
      if (!desde.value || !hasta.value) return;
      caja.desde = desde.value <= hasta.value ? desde.value : hasta.value;
      caja.hasta = desde.value <= hasta.value ? hasta.value : desde.value;
      pintarHoja();
    };
    desde.onchange = cambiar; hasta.onchange = cambiar;
  }
  const sel = document.getElementById('conductor');
  if (sel) sel.onchange = () => { caja.conductor = sel.value; pintarHoja(); };
  const quitar = document.getElementById('quitar-conductor');
  if (quitar) quitar.onclick = () => { caja.conductor = ''; pintarHoja(); };
  document.querySelectorAll('[data-elegir]').forEach((tr) => {
    const elegir = () => { caja.conductor = tr.dataset.elegir; pintarHoja(); };
    tr.onclick = elegir;
    tr.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); elegir(); } };
  });
  const exp = document.getElementById('exportar');
  if (exp) exp.onclick = exportarCaja;

  document.querySelectorAll('[data-guardar]').forEach((b) => b.onclick = async () => {
    const fila = b.closest('tr');
    const base = fila.querySelector('[data-campo=base]').value, km = fila.querySelector('[data-campo=km]').value;
    b.disabled = true;
    try {
      await rpc('op_actualizar_municipio', { p_municipio_id: b.dataset.guardar, p_activo: null,
        p_tarifa_base: base === '' ? null : Number(base), p_tarifa_por_km: km === '' ? null : Number(km) });
      await refrescarTodo();
    } catch (e) { alert(textoError(e)); b.disabled = false; }
  });
  document.querySelectorAll('[data-activar]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try {
      await rpc('op_actualizar_municipio', { p_municipio_id: b.dataset.activar, p_activo: b.dataset.valor === 'true', p_tarifa_base: null, p_tarifa_por_km: null });
      await refrescarTodo();
    } catch (e) { alert(textoError(e)); b.disabled = false; }
  });
}

async function refrescarTodo() {
  metricas = await rpc('op_metricas').catch(() => ({}));
  cacheConductores = [];
  ultimaCarga = new Date().toISOString();
  raiz.innerHTML = armazon();
  conectarArmazon();
  await pintarHoja();
}

function conectarArmazon() {
  document.getElementById('salir').onclick = async () => { if (DEMO) return; await sb.auth.signOut(); location.reload(); };
  const r = document.getElementById('refrescar');
  r.onclick = async () => { r.classList.add('girando'); await refrescarTodo().catch(() => {}); };
  document.getElementById('tema').onclick = () => {
    aplicarTema(temaEfectivo() === 'oscuro' ? 'claro' : 'oscuro');
    raiz.innerHTML = armazon(); conectarArmazon(); pintarHoja();
  };
  document.querySelectorAll('.pestana[data-p]').forEach((b) => b.onclick = () => irA(b.dataset.p));
}

setInterval(() => {

}, 15000);

async function arrancarSesion() {
  raiz.innerHTML = '<div class="cargando" style="padding:40px">Entrando…</div>';
  let perfil;
  try { perfil = await rpc('mi_perfil'); }
  catch (e) { return pintarEntrada('telefono', {}, textoError(e)); }

  if (!perfil?.es_operador) {
    raiz.innerHTML = `<div class="entrada">${ladoMarca()}<div class="formulario"><div style="max-width:440px">
      <h1>Esta cuenta no es de la central</h1>
      <p class="intro">El número entró bien, pero no tiene permiso de operación. Alguien con acceso a la base de datos tiene que correr esto:</p>
      <pre class="sql">insert into operador (usuario_id, nombre)
values ('${esc(perfil?.id ?? 'tu-uuid')}', '${esc(perfil?.nombre ?? 'Tu nombre')}');</pre>
      <button class="btn" id="salir2">Salir</button></div></div></div>`;
    document.getElementById('salir2').onclick = async () => { await sb.auth.signOut(); location.reload(); };
    return;
  }
  estado.perfil = perfil;
  await refrescarTodo();
  setInterval(() => {
    if (!document.hidden && (estado.pestana === 'viajes' || estado.pestana === 'seguridad' || (estado.pestana === 'caja' && caja.rango === 'hoy'))) {
      refrescarTodo().catch(() => {});
    }
  }, 30000);
}

async function arrancar() {
  if (DEMO) { sb = clienteDemo(); estado.perfil = { nombre: 'Demo' }; return refrescarTodo(); }
  const config = leerConfig();
  if (!config?.url || !config?.anon) return pintarConfiguracion();
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
    sb = createClient(config.url, config.anon, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  } catch (e) { return pintarConfiguracion(textoError(e)); }
  const { data } = await sb.auth.getSession();
  if (data.session) await arrancarSesion(); else pintarEntrada();
}

          : [2600, 2600, 3100, 3700, 5600, 2600][(semilla(d + c.conductor_id + i)) % 6];
        filas.push({ d, c, monto });
        if (p_conductor) viajes.push({ fin_at: `${d}T${String(13 + i % 10).padStart(2, '0')}:${String((i * 17) % 60).padStart(2, '0')}:00-05:00`, monto,
          destino: ['Polideportivo', 'La Ye', 'Barrio El Instituto', 'Hospital', 'Inpec / Julio Tejo', 'La Bomba'][i % 6], ocupacion: 1 + (i % 3 === 0) });
      }
    }
    const pc = conds.map((c) => {
      const f = filas.filter((x) => x.c === c);
      return { conductor_id: c.conductor_id, nombre: c.nombre, telefono: c.telefono, placa: c.vehiculo?.placa, numero_movil: c.vehiculo?.numero_movil,
        viajes: f.length, recaudo: f.reduce((a, x) => a + x.monto, 0), ultimo: new Date(Date.now() - 1000 * 60 * (20 + semilla(c.conductor_id) % 90)).toISOString() };
    }).filter((x) => x.viajes).sort((a, b) => b.recaudo - a.recaudo);
    return { desde: p_desde, hasta: p_hasta,
      resumen: { viajes: filas.length, recaudo: filas.reduce((a, x) => a + x.monto, 0), conductores: pc.length, pasajeros: Math.round(filas.length * 1.3) },
      por_dia: dias.map((d) => { const f = filas.filter((x) => x.d === d); return { dia: d, viajes: f.length, recaudo: f.reduce((a, x) => a + x.monto, 0) }; }),
      por_conductor: pc, viajes: viajes.sort((a, b) => b.fin_at.localeCompare(a.fin_at)) };
  };
  const respuestas = {
    op_metricas: () => metr,
    op_conductores: () => C,
    op_acumulado: acumulado,
    op_viajes_en_curso: () => [
      { estado: 'en_curso', sos: 0, pasajero: { nombre: 'Luz Marina Ospina', telefono: '+573116620045' }, conductor: { nombre: 'Jhoiner Galvis', telefono: '+573104458821' },
        municipio: 'Pácora', destino_nombre: 'La Ye', precio_estimado: 3700, inicio_at: new Date(Date.now() - 6e5).toISOString(),
        conductor_ubicacion: { lat: 5.5262, lng: -75.4597 }, conductor_ubicacion_at: new Date(Date.now() - 2e4).toISOString() },
      { estado: 'aceptado', sos: 0, pasajero: { nombre: 'Carlos Nieto', telefono: '+573024419983' }, conductor: { nombre: 'Gerardo Castaño', telefono: '+573145529907' },
        municipio: 'Pácora', destino_nombre: 'Polideportivo', precio_estimado: 2600, inicio_at: new Date(Date.now() - 1.5e5).toISOString(),
        conductor_ubicacion: { lat: 5.5271, lng: -75.4611 }, conductor_ubicacion_at: new Date(Date.now() - 4e4).toISOString() },
    ],
    op_eventos_seguridad: () => [
      { tipo: 'compartir', usuario: { nombre: 'Luz Marina Ospina', telefono: '+573116620045' }, contacto_confianza: '+573108852210', municipio: 'Pácora', at: new Date(Date.now() - 5.4e5).toISOString(), ubicacion_conductor: { lat: 5.5262, lng: -75.4597 } },
    ],
    op_municipios: () => [{ id: 'm1', nombre: 'Pácora', departamento: 'Caldas', activo: true, tarifa_base: 2600, tarifa_por_km: 900, puntos: 33, conductores_disponibles: 3, conductores_verificados: 5 }],
  };
  return {
    rpc: async (n, a) => ({ data: respuestas[n] ? respuestas[n](a ?? {}) : [], error: null }),
    auth: { signOut: async () => {} },
  };
}
